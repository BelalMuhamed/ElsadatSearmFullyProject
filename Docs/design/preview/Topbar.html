<!doctype html>
<html lang="ar" dir="rtl"><head><link rel="stylesheet" href="./assets/fonts.css">
<meta charset="utf-8">
<title>الشريط العلوي</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></head>
<body>


<header dir="rtl" style="font-family: 'IBM Plex Sans Arabic', sans-serif;width: 100%; min-height: 68px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 28px; background: rgba(16,13,9,0.72); border-bottom: 1px solid rgba(255,232,190,0.07); color: #EDE5D6;">
  <label style="position: relative; flex: 0 1 440px; min-width: 240px; height: 42px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12px; background: rgba(255,240,210,0.04); border: 1px solid rgba(255,232,190,0.12); color: #BDB29E;">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-3.5-3.5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">بحث شامل</span>
    <input type="search" placeholder="ابحث برقم فاتورة، عميل، منتج، سبّاك…" style="font-family: &quot;IBM Plex Sans Arabic&quot;, sans-serif; flex: 1 1 0%; min-width: 0px; border: 0px; background: transparent; outline: none; color: rgb(237, 229, 214); font-size: 13.5px;">
    <kbd dir="ltr" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 7px; border-radius: 6px; border: 1px solid rgba(255,232,190,0.12); color: #BDB29E;">Ctrl K</kbd>
  </label>

  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
    <a href="#approvals" style="font-family: 'IBM Plex Sans Arabic', sans-serif;height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 600; background: rgba(242,153,74,0.10); border: 1px solid rgba(242,153,74,0.35); color: #F5A862;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4H5v17h14V4h-2M9 3h6v3H9zM9 13l2 2 4-4"></path></svg>
      <span>مستني موافقتك</span>
      <span style="min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: #F2994A; color: #1A1408; font-weight: 700; font-size: 12px;">١٢</span>
    </a>
    <button type="button" aria-label="الرسايل، ٢ غير مقروءة" title="الرسايل" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,232,190,0.12); background: rgba(255,240,210,0.04); color: #EDE5D6; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      <span style="font-family: 'IBM Plex Sans Arabic', sans-serif;position: absolute; top: -5px; left: -5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 999px; background: #EF6461; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">٢</span>
    </button>
    <button type="button" aria-label="الإشعارات، ٣ جديدة" title="الإشعارات" style="position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,232,190,0.12); background: rgba(255,240,210,0.04); color: #EDE5D6; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>
      <span style="font-family: 'IBM Plex Sans Arabic', sans-serif;position: absolute; top: -5px; left: -5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 999px; background: #EF6461; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">٣</span>
    </button>
    <div role="group" aria-label="الثيم" style="display: flex; padding: 3px; border-radius: 11px; background: rgba(255,240,210,0.05); border: 1px solid rgba(255,232,190,0.12);">
      <button type="button" aria-pressed="true" style="font-family: 'IBM Plex Sans Arabic', sans-serif;height: 30px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: #F6F1E7; color: #1A1408;">داكن</button>
      <button type="button" aria-pressed="false" style="font-family: 'IBM Plex Sans Arabic', sans-serif;height: 30px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: transparent; color: #BDB29E;">فاتح</button>
    </div>
    <div role="group" aria-label="اللغة" style="display: flex; padding: 3px; border-radius: 11px; background: rgba(255,240,210,0.05); border: 1px solid rgba(255,232,190,0.12);">
      <button type="button" aria-pressed="true" style="font-family: 'IBM Plex Sans Arabic', sans-serif;height: 30px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: #F6F1E7; color: #1A1408;">ع</button>
      <button type="button" aria-pressed="false" style="font-family: 'IBM Plex Sans Arabic', sans-serif;height: 30px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; background: transparent; color: #BDB29E;">EN</button>
    </div>
  </div>
</header>




</body></html>
