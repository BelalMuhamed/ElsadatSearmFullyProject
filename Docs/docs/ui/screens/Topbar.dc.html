<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الشريط العلوي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header dir="rtl" style="{{root}}">
  <label style="{{search}}">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM20 20l-3.5-3.5"></path></svg>
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">بحث شامل</span>
    <input type="search" placeholder="ابحث برقم فاتورة، عميل، منتج، سبّاك…" style="{{searchInput}}">
    <kbd dir="ltr" style="{{kbd}}">Ctrl K</kbd>
  </label>

  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
    <a href="#approvals" style="{{approvals}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4H5v17h14V4h-2M9 3h6v3H9zM9 13l2 2 4-4"></path></svg>
      <span>مستني موافقتك</span>
      <span style="{{approvalsCount}}">١٢</span>
    </a>
    <button type="button" aria-label="الرسايل، ٢ غير مقروءة" title="الرسايل" style="{{iconBtn}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
      <span style="{{dot}}">٢</span>
    </button>
    <button type="button" aria-label="الإشعارات، ٣ جديدة" title="الإشعارات" style="{{iconBtn}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>
      <span style="{{dot}}">٣</span>
    </button>
    <div role="group" aria-label="الثيم" style="{{segWrap}}">
      <button type="button" aria-pressed="{{darkOn}}" style="{{segDark}}">داكن</button>
      <button type="button" aria-pressed="{{lightOn}}" style="{{segLight}}">فاتح</button>
    </div>
    <div role="group" aria-label="اللغة" style="{{segWrap}}">
      <button type="button" aria-pressed="true" style="{{segAr}}">ع</button>
      <button type="button" aria-pressed="false" style="{{segEn}}">EN</button>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1176,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.theme === 'light';
    const t = light ? {
      bg: 'rgba(255,255,255,0.86)', line: '#ECE4D4', text: '#2A2418', text2: '#5E5544', field: '#F7F3EA', fieldLine: '#E4DACA',
      segBg: '#F2ECDF', segOn: '#2A2418', segOnText: '#FFFFFF', apprBg: '#FFF4E6', apprLine: '#F0C9A0', apprText: '#8A3F06', apprCountBg: '#B4570C'
    } : {
      bg: 'rgba(16,13,9,0.72)', line: 'rgba(255,232,190,0.07)', text: '#EDE5D6', text2: '#BDB29E', field: 'rgba(255,240,210,0.04)', fieldLine: 'rgba(255,232,190,0.12)',
      segBg: 'rgba(255,240,210,0.05)', segOn: '#F6F1E7', segOnText: '#1A1408', apprBg: 'rgba(242,153,74,0.10)', apprLine: 'rgba(242,153,74,0.35)', apprText: '#F5A862', apprCountBg: '#F2994A'
    };
    const font = "font-family: 'IBM Plex Sans Arabic', sans-serif;";
    const seg = (on) => font + 'height: 30px; min-width: 40px; padding: 0 12px; border: 0; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; ' +
      (on ? 'background: ' + t.segOn + '; color: ' + t.segOnText + ';' : 'background: transparent; color: ' + t.text2 + ';');
    return {
      darkOn: light ? 'false' : 'true', lightOn: light ? 'true' : 'false',
      root: font + 'width: 100%; min-height: 68px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 28px; background: ' + t.bg + '; border-bottom: 1px solid ' + t.line + '; color: ' + t.text + ';',
      search: 'position: relative; flex: 0 1 440px; min-width: 240px; height: 42px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12px; background: ' + t.field + '; border: 1px solid ' + t.fieldLine + '; color: ' + t.text2 + ';',
      searchInput: font + 'flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: ' + t.text + '; font-size: 13.5px;',
      kbd: "font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 7px; border-radius: 6px; border: 1px solid " + t.fieldLine + '; color: ' + t.text2 + ';',
      approvals: font + 'height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: 600; background: ' + t.apprBg + '; border: 1px solid ' + t.apprLine + '; color: ' + t.apprText + ';',
      approvalsCount: 'min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: ' + t.apprCountBg + '; color: ' + (light ? '#FFFFFF' : '#1A1408') + '; font-weight: 700; font-size: 12px;',
      iconBtn: 'position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid ' + t.fieldLine + '; background: ' + t.field + '; color: ' + t.text + '; display: flex; align-items: center; justify-content: center; cursor: pointer;',
      dot: font + 'position: absolute; top: -5px; left: -5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 999px; background: #EF6461; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;',
      segWrap: 'display: flex; padding: 3px; border-radius: 11px; background: ' + t.segBg + '; border: 1px solid ' + t.fieldLine + ';',
      segDark: seg(!light), segLight: seg(light), segAr: seg(true), segEn: seg(false)
    };
  }
}
</script>
</body>
</html>
